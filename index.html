<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0b1426" />
    <meta
      name="description"
      content="Control Storz & Bickel vaporizers (Volcano Hybrid, Venty, Veazy, Crafty) via Web Bluetooth"
    />
    <meta name="apple-mobile-web-app-title" content="Crafty Atelier" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Crafty Atelier</title>
    <style>
      #loading-screen {
        position: fixed;
        z-index: 9999;
        inset: 0;
        width: 100vw;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1rem;
        overflow: hidden;
        background: #050414;
        color: #fff;
        font: 600 1rem system-ui, sans-serif;
        letter-spacing: 0.04em;
      }

      #loading-screen .loading-background {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #loading-screen .loading-logo {
        position: relative;
        z-index: 1;
        width: min(42vw, 192px);
        height: auto;
        box-shadow: 0 12px 48px rgb(0 0 0 / 0.35);
        border-radius: 50%;
        mix-blend-mode: screen;
      }

      #loading-screen span {
        position: relative;
        z-index: 1;
      }
    </style>
    <script>
      // Apply the stored theme before the first paint to avoid a flash
      (() => {
        try {
          document.documentElement.dataset.skin = ["court", "signal", "jelly"].includes(localStorage.getItem("crafty-theme")) ? localStorage.getItem("crafty-theme") : "court";
          const stored = localStorage.getItem("isDarkModeVReverse");
          const dark =
            stored === null
              ? matchMedia("(prefers-color-scheme: dark)").matches
              : stored === "true";
          document.documentElement.classList.toggle("dark", dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0b1426" : "#eef3fc");
          const effects = localStorage.getItem("effects");
          document.documentElement.dataset.effects =
            effects === "off" || effects === "strong" ? effects : "subtle";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-label="Crafty Atelier loading">
      <img
        class="loading-background"
        src="%BASE_URL%loading-background.jpg?v=2"
        alt=""
      />
      <img class="loading-logo" src="%BASE_URL%loading-logo.png?v=2" alt="" />
      <span>Crafty Atelier</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
