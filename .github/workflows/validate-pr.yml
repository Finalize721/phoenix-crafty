name: Validate pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Install Chromium for mobile layout tests
        run: bunx playwright install --with-deps chromium
      - name: Test Crafty layout and appearance in Chromium
        run: bun run test:e2e --project=chromium e2e/crafty-layout.spec.ts e2e/themes.spec.ts
